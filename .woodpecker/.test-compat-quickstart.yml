steps:
  setup:
    image: node:24-slim
    pull: true
    commands:
      - npm i -g corepack@0.36
      - pnpm i --no-frozen-lockfile
      - pnpm test:quickstart:setup
  lint:
    image: node:24-slim
    pull: true
    depends_on: [setup]
    commands:
      - cd quickstart
      - npm run lint:js
      - npm run lint:types
  test:
    image: cypress/browsers:24.22.1
    depends_on: [setup]
    commands:
      - cd quickstart
      - npm run test

when:
  event:
    - pull_request

depends_on:
  - verify-pr
