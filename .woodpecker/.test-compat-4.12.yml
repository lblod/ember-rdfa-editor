steps:
  test-compat:
    image: cypress/browsers:24.22.1
    environment:
      PNPM_CONFIG_INJECT_WORKSPACE_PACKAGES: "true"
      PNPM_CONFIG_SYNC_INJECTED_DEPS_AFTER_SCRIPTS: '["build"]'
    commands:
      - npm i -g corepack@0.36
      - corepack enable
      - pnpm i --no-frozen-lockfile
      - pnpm build
      - pnpm --filter test-app exec ember try:one ember-lts-4.12 --skip-cleanup=true
when:
  event:
    - pull_request

depends_on:
  - verify-pr
