steps:
  test-compat:
    image: node:24-slim
    commands:
      - echo "inject-workspace-packages=true" >> .npmrc
      - echo "sync-injected-deps-after-scripts[]=build" >> .npmrc
      - pnpm i --frozen-lockfile
      - pnpm build
      - pnpm --filter test-app exec ember try:one ember-lts-6.12.0 --skip-cleanup=true
when:
  event:
    - pull_request

depends_on:
  - verify-pr
